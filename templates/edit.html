
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: #f4f6fa;
            color: #1b2437;
        }

        header {
            background: white;
            border-bottom: 1px solid #e4e8f0;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        h1 { margin: 0; font-size: 24px; }

        p {
            color: #667085;
            font-size: 14px;
            margin: 5px 0 0;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .back {
            color: #1b2437;
            background: white;
            border: 1px solid #e4e8f0;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 35px 24px;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,.04);
        }

        h2 {
            font-size: 19px;
            margin: 0 0 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full { grid-column: 1/-1; }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cfd6e4;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2f4bd8;
            box-shadow: 0 0 0 3px rgba(47,75,216,.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e4e8f0;
        }

        .submit {
            background: #2f4bd8;
            color: white;
            flex: 1;
        }

        .submit:hover { background: #2339b0; }

        @media(max-width: 520px) {
            .header-inner, main { padding: 18px 15px; }
            .form-container { padding: 20px; }
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
            .actions { flex-direction: column-reverse; }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <h1>Edit Student</h1>
            <p>Update information for {{ student[1] }}</p>
        </div>

        <a href="/" class="btn back">← Back to Home</a>
    </div>
</header>

<main>

    <div class="form-container">

        <h2>Edit Student Information</h2>

        <form action="/students/update/{{ student[0] }}" method="post">

            <div class="grid">

                <div class="field full">
                    <label for="name">Student Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           value="{{ student[1] }}"
                           required>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number"
                           id="age"
                           name="age"
                           value="{{ student[2] }}"
                           min="18"
                           max="30"
                           required>
                </div>

                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="Male"
                            {% if student[3] == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if student[3] == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if student[3] == "Other" %}selected{% endif %}>
                            Other
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="marks">Marks</label>
                    <input type="number"
                           id="marks"
                           name="marks"
                           value="{{ student[4] }}"
                           min="0"
                           max="100"
                           required>
                </div>

                <div class="field">
                    <label for="status">Attendance Status</label>
                    <select id="status" name="status" required>
                        <option value="1"
                            {% if student[7] == 1 %}selected{% endif %}>
                            Present
                        </option>

                        <option value="0"
                            {% if student[7] == 0 %}selected{% endif %}>
                            Absent
                        </option>
                    </select>
                </div>

                <div class="field full">
                    <label for="course">Course</label>
                    <input type="text"
                           id="course"
                           name="course"
                           value="{{ student[5] }}"
                           required>
                </div>

                <div class="field full">
                    <label for="image">Student Image URL</label>
                    <input type="url"
                           id="image"
                           name="image"
                           value="{{ student[6] }}"
                           required>
                </div>

            </div>

            <div class="actions">
                <a href="/" class="btn back">Cancel</a>

                <button type="submit" class="btn submit">
                    Update Student
                </button>
            </div>

        </form>

    </div>

</main>

</body>
</html>
